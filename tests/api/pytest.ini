[pytest]
# 抽奖系统接口自动化测试 — pytest 配置
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记：按测试层次区分，便于分层执行
markers =
    smoke: 冒烟用例（P0，核心链路，秒级）
    keypath: 关键路径用例（第③步：正常流与分支）
    boundary: 边界与异常用例（第④步）
    reverse: 反向验证用例（故意破坏，断言必须失败）
    perf: 性能相关（第⑤步 JMeter 联动）

# 输出
addopts = -v --tb=short --strict-markers -p no:cacheprovider

# 超时保护（避免 MQ/AI 外部依赖长时间挂起）
# 注：pytest-timeout 未安装，超时由 requests timeout 参数控制
