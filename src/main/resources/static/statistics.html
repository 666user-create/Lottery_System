<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数据统计</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/base.css?v=20260913">
    <script src="./js/auth-guard.js?v=20260916"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 0 30px 30px;
            color: #222;
        }
        h2 {
            background: #fff;
            width: 100%;
            font-weight: 600;
            font-size: 18px;
            color: #000;
            height: 70px;
            display: flex;
            align-items: center;
            margin-bottom: 0;
            /* 标题行内插入返回箭头后补 10px 间距，箭头宽度 34px 远小于 70px 行高，不撑高标题 */
            gap: 10px;
        }
        h3 {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin: 0 0 14px;
        }
        .panel {
            background: #fff;
            border: 1px solid #ececec;
            border-radius: 8px;
            padding: 18px 20px;
            margin-bottom: 18px;
        }
        /* 总览卡片 */
        .card-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 18px;
        }
        .stat-card {
            flex: 1 1 140px;
            min-width: 140px;
            background: #f7f9ff;
            border: 1px solid #e3ebff;
            border-radius: 8px;
            padding: 16px 18px;
        }
        .stat-card .label {
            font-size: 13px;
            color: #8a94a6;
            font-weight: 400;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 26px;
            font-weight: 600;
            color: #4C8DFB;
            line-height: 1.1;
        }
        .stat-card .value .unit {
            font-size: 13px;
            font-weight: 400;
            color: #8a94a6;
            margin-left: 4px;
        }
        /* 表格 */
        table {
            width: 100%;
            border-collapse: collapse;
            font-weight: 400;
            font-size: 14px;
        }
        thead th {
            background-color: #f7f7f7;
            color: #999;
            font-weight: 600;
            font-size: 14px;
            padding: 14px 10px;
            text-align: center;
            border: none;
        }
        tbody td {
            padding: 14px 10px;
            text-align: center;
            border: none;
            border-bottom: 1px solid #f2f2f2;
            vertical-align: middle;
        }
        .empty-tip {
            text-align: center;
            color: #999;
            font-size: 14px;
            padding: 26px 0;
        }
        /* 进度条 */
        .progress {
            height: 10px;
            background-color: #eef1f6;
            border-radius: 6px;
            margin-bottom: 6px;
            overflow: hidden;
        }
        .progress-bar {
            background-color: #4C8DFB;
        }
        .pct {
            font-size: 12px;
            color: #8a94a6;
            font-weight: 400;
        }
        /* 活动选择区 */
        .activity-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .activity-bar label {
            font-size: 14px;
            color: #333;
            margin: 0;
            font-weight: 400;
            white-space: nowrap;
        }
        .activity-bar select {
            max-width: 320px;
            height: 38px;
            font-size: 14px;
        }
        .badge-status {
            display: inline-block;
            font-size: 12px;
            font-weight: 400;
            padding: 2px 10px;
            border-radius: 10px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .badge-running { background: #e6f4ea; color: #1e8e3e; }
        .badge-completed { background: #f1f3f4; color: #80868b; }
        .summary-metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            padding: 4px 0 18px;
        }
        .summary-metrics .item .label {
            font-size: 13px;
            color: #8a94a6;
            font-weight: 400;
        }
        .summary-metrics .item .value {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        .col-progress { width: 26%; }
        /* 左上角返回箭头：被外壳 iframe 嵌入时隐藏（由外壳导航），直接打开 URL 时可见 */
        .page-back { display: inline-flex; align-items: center; justify-content: center;
                     width: 34px; height: 34px; border-radius: 50%; font-size: 20px; line-height: 1;
                     color: #6b7280; text-decoration: none; flex-shrink: 0;
                     transition: background .15s, color .15s; }
        .page-back:hover { background: rgba(0, 0, 0, .06); color: #333; }
        html.embedded .page-back { display: none !important; }
    </style>
    <script>
        /* 被管理端外壳(admin.html)以 iframe 嵌入时为 <html> 加 embedded 类，用于隐藏页内返回箭头 */
        try { if (window.self !== window.top) { document.documentElement.className += ' embedded'; } } catch (e) { }
    </script>
</head>
<body>
<!-- 返回箭头放在标题行最左侧，由 h2 的 flex 布局与标题同行居中 -->
<h2><a href="admin.html" class="page-back" title="返回管理台" aria-label="返回管理台">&#8592;</a>数据统计</h2>

<!-- 全局总览 -->
<div class="card-row" id="overviewCards">
    <div class="stat-card"><div class="label">加载中…</div><div class="value">--</div></div>
</div>

<!-- 奖品等级中奖分布 -->
<div class="panel">
    <h3>各奖品等级中奖分布</h3>
    <table>
        <thead>
        <tr>
            <th>奖品等级</th>
            <th>中奖数量（份）</th>
        </tr>
        </thead>
        <tbody id="tierTableBody">
        <tr><td colspan="2" class="empty-tip">加载中…</td></tr>
        </tbody>
    </table>
</div>

<!-- 活动维度统计 -->
<div class="panel">
    <h3>活动维度统计</h3>
    <div class="activity-bar">
        <label for="activitySelect">选择活动：</label>
        <select class="form-control" id="activitySelect"></select>
    </div>
    <div id="activitySummary"></div>
    <table>
        <thead>
        <tr>
            <th>奖品等级</th>
            <th>奖品名称</th>
            <th>总份数</th>
            <th>已中奖</th>
            <th class="col-progress">中奖进度</th>
        </tr>
        </thead>
        <tbody id="prizeStatTableBody">
        <tr><td colspan="5" class="empty-tip">请选择活动</td></tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    var userToken = localStorage.getItem("token");

    // 统一转义，避免活动名/奖品名中的特殊字符破坏页面结构
    function esc(text) {
        return String(text == null ? '' : text).replace(/[&<>"']/g, function (c) {
            return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
        });
    }

    function progressHtml(drawn, total) {
        var value = Number(drawn) || 0;
        var sum = Number(total) || 0;
        var pct = sum > 0 ? Math.round(value * 100 / sum) : 0;
        if (pct > 100) {
            pct = 100;
        }
        if (pct < 0) {
            pct = 0;
        }
        return '<div class="progress"><div class="progress-bar" role="progressbar" ' +
            'style="width:' + pct + '%" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"></div></div>' +
            '<span class="pct">' + pct + '%</span>';
    }

    // ---------- 全局总览 ----------
    function loadOverview() {
        $.ajax({
            url: '/api/stat/overview',
            type: 'GET',
            dataType: 'json',
            headers: {token: userToken},
            success: function (result) {
                if (window.AuthGuard && AuthGuard.handle(result, '查询数据统计')) return;
                if (result.code != 200) {
                    alert("查询数据统计失败！" + result.message);
                    return;
                }
                renderOverview(result.data);
            },
            error: function (err) {
                if (window.AuthGuard && AuthGuard.handle(err, '查询数据统计')) return;
                console.log(err);
            }
        });
    }

    function renderOverview(data) {
        if (!data) return;
        var cards = [
            {label: '活动总数', value: data.activityTotal, unit: '个'},
            {label: '进行中活动', value: data.activityRunning, unit: '个'},
            {label: '已完成活动', value: data.activityCompleted, unit: '个'},
            {label: '已开奖活动', value: data.activityDrawn, unit: '个'},
            {label: '奖品总数', value: data.prizeTotal, unit: '种'},
            {label: '注册用户数', value: data.userTotal, unit: '人'},
            {label: '累计中奖人次', value: data.winningTotal, unit: '人次'}
        ];
        var html = '';
        cards.forEach(function (card) {
            html += '<div class="stat-card">' +
                '<div class="label">' + esc(card.label) + '</div>' +
                '<div class="value">' + (card.value == null ? 0 : card.value) +
                '<span class="unit">' + esc(card.unit) + '</span></div>' +
                '</div>';
        });
        $('#overviewCards').html(html);

        var tiers = data.tierStats || [];
        var tierHtml = '';
        if (tiers.length === 0) {
            tierHtml = '<tr><td colspan="2" class="empty-tip">暂无中奖记录</td></tr>';
        } else {
            tiers.forEach(function (tier) {
                tierHtml += '<tr><td>' + esc(tier.tierName) + '</td>' +
                    '<td>' + (tier.count == null ? 0 : tier.count) + '</td></tr>';
            });
        }
        $('#tierTableBody').html(tierHtml);
    }

    // ---------- 活动列表（下拉框） ----------
    function loadActivityOptions() {
        $.ajax({
            url: '/activity/find-list',
            type: 'GET',
            data: {currentPage: 1, pageSize: 100},
            dataType: 'json',
            headers: {token: userToken},
            success: function (result) {
                if (window.AuthGuard && AuthGuard.handle(result, '查询活动列表')) return;
                if (result.code != 200) {
                    alert("查询活动列表失败！" + result.message);
                    return;
                }
                var records = (result.data && result.data.records) || [];
                var $select = $('#activitySelect');
                $select.empty();
                if (records.length === 0) {
                    $select.append($('<option>').val('').text('暂无活动'));
                    $('#prizeStatTableBody').html('<tr><td colspan="5" class="empty-tip">暂无活动</td></tr>');
                    return;
                }
                records.forEach(function (activity) {
                    $select.append($('<option>').val(activity.activityId).text(activity.activityName));
                });
                loadActivityStat(records[0].activityId);
            },
            error: function (err) {
                if (window.AuthGuard && AuthGuard.handle(err, '查询活动列表')) return;
                console.log(err);
            }
        });
    }

    // ---------- 单个活动统计 ----------
    function loadActivityStat(activityId) {
        if (!activityId) return;
        $('#prizeStatTableBody').html('<tr><td colspan="5" class="empty-tip">加载中…</td></tr>');
        $.ajax({
            url: '/api/stat/activity',
            type: 'GET',
            data: {activityId: activityId},
            dataType: 'json',
            headers: {token: userToken},
            success: function (result) {
                if (window.AuthGuard && AuthGuard.handle(result, '查询活动统计')) return;
                if (result.code != 200) {
                    alert("查询活动统计失败！" + result.message);
                    $('#prizeStatTableBody').html('<tr><td colspan="5" class="empty-tip">查询失败</td></tr>');
                    return;
                }
                renderActivityStat(result.data);
            },
            error: function (err) {
                if (window.AuthGuard && AuthGuard.handle(err, '查询活动统计')) return;
                console.log(err);
                $('#prizeStatTableBody').html('<tr><td colspan="5" class="empty-tip">查询失败</td></tr>');
            }
        });
    }

    function renderActivityStat(data) {
        if (!data) return;
        var badgeClass = data.statusMessage === '活动进行中' ? 'badge-running' : 'badge-completed';
        var summaryHtml =
            '<div class="summary-metrics">' +
            '  <div class="item"><div class="label">活动名称</div><div class="value">' +
            esc(data.activityName) +
            '<span class="badge-status ' + badgeClass + '">' + esc(data.statusMessage || '') + '</span>' +
            '</div></div>' +
            '  <div class="item"><div class="label">参与人数</div><div class="value">' +
            (data.participantTotal == null ? 0 : data.participantTotal) + '</div></div>' +
            '  <div class="item"><div class="label">奖品总份数</div><div class="value">' +
            (data.prizeAmountTotal == null ? 0 : data.prizeAmountTotal) + '</div></div>' +
            '  <div class="item"><div class="label">已中奖份数</div><div class="value">' +
            (data.drawnTotal == null ? 0 : data.drawnTotal) + '</div></div>' +
            '  <div class="item"><div class="label">开奖进度</div><div class="value">' +
            (data.prizeAmountTotal > 0
                ? Math.round((data.drawnTotal || 0) * 100 / data.prizeAmountTotal)
                : 0) + '%</div></div>' +
            '</div>';
        $('#activitySummary').html(summaryHtml);

        var prizes = data.prizeStats || [];
        var rows = '';
        if (prizes.length === 0) {
            rows = '<tr><td colspan="5" class="empty-tip">该活动暂无奖品</td></tr>';
        } else {
            prizes.forEach(function (prize) {
                rows += '<tr>' +
                    '<td>' + esc(prize.prizeTierName) + '</td>' +
                    '<td>' + esc(prize.prizeName) + '</td>' +
                    '<td>' + (prize.prizeAmount == null ? 0 : prize.prizeAmount) + '</td>' +
                    '<td>' + (prize.drawn == null ? 0 : prize.drawn) + '</td>' +
                    '<td>' + progressHtml(prize.drawn, prize.prizeAmount) + '</td>' +
                    '</tr>';
            });
        }
        $('#prizeStatTableBody').html(rows);
    }

    $(document).ready(function () {
        loadOverview();
        loadActivityOptions();

        $('#activitySelect').on('change', function () {
            loadActivityStat($(this).val());
        });
    });
</script>
</body>
</html>
