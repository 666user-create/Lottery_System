<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>创建奖品</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/base.css?v=20260913"></link>
    <script src="./js/auth-guard.js?v=20260916"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 10px auto;
            padding: 20px;
            background-color: #fff;
            /* box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); */
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input[type=text],
        .form-group input[type=url] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form-group textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn {
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 140px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        .prize-row {
            margin-bottom: 10px;
        }
        .container h2{
            font-weight: 600;
            font-size: 30px;
            letter-spacing: 1px;
            color: #000000;
            line-height: 50px;
            text-align: center;
            margin-bottom: 40px;
        }
        .upload-box{
            display: flex;
            width: 150px;
            height: 150px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px dashed  #4c8dfb;
            background-color: #EDF3FE;
            cursor: pointer;
            margin-bottom: 10px;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }
        .plus{
            color: #4C8DFB;
            font-size: 30px;
        }
        .up-txt{
            font-weight: 400;
            font-size: 14px;
            color: #4C8DFB;
        }
        .upload-box .form-control{
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            opacity: 0;
            z-index: 2;
        }
        .preview-img{
            width: 150px;
            height: 150px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            display: none;
            background-color: #fff;
            object-fit: scale-down;
        }
        /* 标题是居中排版的大标题，箭头改为绝对定位到标题行最左侧：
           既落在页面主体左上角，又完全不影响标题与表单原有排版 */
        .title-row { position: relative; }
        /* 左上角返回箭头：被外壳 iframe 嵌入时隐藏（由外壳导航），直接打开 URL 时可见 */
        .page-back { position: absolute; left: 0; top: 8px; display: inline-flex;
                     align-items: center; justify-content: center;
                     width: 34px; height: 34px; border-radius: 50%; font-size: 20px; line-height: 1;
                     color: #6b7280; text-decoration: none; flex-shrink: 0;
                     transition: background .15s, color .15s; }
        .page-back:hover { background: rgba(0, 0, 0, .06); color: #333; }
        html.embedded .page-back { display: none !important; }
    </style>
    <script>
        /* 被管理端外壳(admin.html)以 iframe 嵌入时为 <html> 加 embedded 类，用于隐藏页内返回箭头 */
        try { if (window.self !== window.top) { document.documentElement.className += ' embedded'; } } catch (e) { }
    </script>
</head>
<body>
<div class="container">
    <!-- 返回箭头绝对定位在标题行最左侧，不参与标题原有居中排版 -->
    <div class="title-row">
        <a href="admin.html" class="page-back" title="返回管理台" aria-label="返回管理台">&#8592;</a>
        <h2>开始创建奖品</h2>
    </div>
    <div id="prizeRows">
        <div class="prize-row">
            <div class="form-group">
                <label for="prizeName">奖品名称</label>
                <input class="form-control prize-name" type="text" placeholder="请输入奖品名称" id="prizeName" name="prizeName" required>
            </div>
            <div class="form-group">
                <label for="prizeName">奖品图片</label>
                <div class="img-upload">
                    <!-- 上传图片的框 -->
                    <div class="upload-box">
                        <span class="plus">+</span>
                        <span class="up-txt">上传图片</span>
                        <!-- 预览图 -->
                        <img src="./pic/bg.png" class="preview-img" id="previewImg" alt="" srcset="">
                        <input class="form-control" type="file" onchange="showImg()" id="prizeImageUrl" >
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="price">奖品价格</label>
                <input class="form-control prize-price" placeholder="请输入奖品价格" type="number" id="price" name="price" required>
            </div>
            <div class="form-group">
                <label for="description">奖品描述</label>
                <textarea class="form-control prize-description" id="description" placeholder="请输入奖品描述"  name="description" required></textarea>
            </div>
        </div>
    </div>
    <!-- 将 type="submit" 改为 type="button"，防止有些浏览器默认触发刷新事件打断Ajax -->
    <button type="button" class="btn btn-primary" onclick="submitPrizes()">创建奖品</button>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    var userToken = localStorage.getItem("token");

    // 【修正】已删除全局的 var formData = new FormData(); 防止重复提交bug

    // 提交奖品数据的函数
    function submitPrizes() {
        var formData = new FormData();
        // 后端 /prize/create 的 prizePic 是 @RequestPart 必填项，未选图片必须在前端拦下，
        // 否则请求会因缺少 part 而失败（原先只在有文件时才 append，属于必现缺陷）
        var fileInput = document.getElementById("prizeImageUrl");
        var file = fileInput && fileInput.files[0];
        if (!file) {
            alert('请先选择奖品图片');
            return;
        }
        formData.append("prizePic", file);

        var prizeName = $('#prizeName').val();
        var description = $('#description').val();
        var price = $('#price').val();
        if (!prizeName || !String(prizeName).trim()) {
            alert('请输入奖品名称');
            return;
        }
        if (price === '' || price === null || isNaN(Number(price))) {
            alert('请输入正确的奖品价格');
            return;
        }
        formData.append("param", JSON.stringify({
            prizeName:prizeName,
            description:description,
            price:price,
        }));
        // 发送POST请求到后端接口
        $.ajax({
            url: '/prize/create',
            type: 'POST',
            contentType : false,
            processData : false,
            headers: {
                "token": userToken
            },
            data: formData,
            success: function(result) {
                if (window.AuthGuard && AuthGuard.handle(result, '创建奖品')) return;
                if(result.code == 200) {
                    alert('奖品创建成功！');

                    // 1. 尝试操作父页面DOM，更新左侧菜单高亮 (通用写法)
                    try {
                        if(window.parent && window.parent.$) {
                            var parent$ = window.parent.$;
                            // 移除以前的高亮 (常见的高亮class为 active 或 layui-this)
                            parent$('.active').removeClass('active');
                            parent$('.layui-this').removeClass('layui-this');

                            // 找到奖品列表的菜单 a 标签，并加上高亮
                            var targetMenu = parent$('a[href*="prizes-list.html"], a[data-url*="prizes-list.html"]');
                            targetMenu.addClass('active').parent().addClass('active');
                        }
                    } catch (e) {
                        console.log("更新父页面菜单状态失败", e);
                    }

                    // 2. 只跳当前的 iframe 内容区，左侧菜单不消失
                    window.location.href = 'prizes-list.html';
                } else {
                    alert('创建奖品失败：' + result.message);
                }
            },
            error:function(err){
                if (window.AuthGuard && AuthGuard.handle(err, '创建奖品')) return;
                // 注：后端业务失败返回 HTTP 200（错误码在 body.code），此处仅处理传输层错误；
                // 401/403 已由 AuthGuard 在 success 分支统一处理（修复 BUG-012）
                console.log(err);
            }
        });
    }

    // 上传图片：读取用户通过文件输入选择的图片文件，并将其显示在一个网页元素中
    function showImg(){
        var file =  document.getElementById("prizeImageUrl").files[0];
        if (!file) return;
        var r= new FileReader();
        r.readAsDataURL(file);
        r.onload=function (e) {
            console.log(e);
            $('#previewImg').attr("src", e.target.result).show();
        }
    }

</script>
</body>
</html>
