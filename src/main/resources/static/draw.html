<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>抽奖页面</title>
    <script src="./js/auth-guard.js?v=20260916"></script>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            text-align: center;
            background: url("./pic/bg.png") no-repeat;
            overflow: hidden;
            background-size: 100% 100%;
            font-weight: bold;
            color: #D40000;
        }
        #container {
            min-width: 1000px;
            min-height: 700px;
        }
        #title {
            font-size: 100px;
            margin-top: 80px;
        }
        #disc {
            font-size: 40px;
            margin: 10px 0;
        }
        #image {
            margin-top: 20px;
            max-height: 280px;
            border: 1px solid #E23540FF;
            border-radius: 20px;
        }
        #list {
            margin: 0 auto;
            max-width: 800px;
        }
        #list span {
            display: inline-block;
            width: 160px;
            font-size: 36px;
            margin-top: 8px;
        }
        .records-item {
            text-align: center;
            cursor: pointer;
            padding: 20px;
            transition: background-color 0.3s;
            font-size: 20px;
        }
        .opt-box{
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 30px;
        }
        .opt-box .btn{
            width: 120px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #D40000;
            margin-inline: 18px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: normal;
            font-size: 15px;
        }
        .opt-box .btn:hover{
            background-color: #D40000;
            color: #fff;
        }
        /* 抽奖结束后的「已全部抽完」：置灰且不再有 hover 反色，
           让"这里是终点"一眼可见，而不是让人反复点怀疑页面卡了 */
        .opt-box .btn.disabled,
        .opt-box .btn.disabled:hover{
            background-color: transparent;
            color: #999;
            border-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
<div id="container">
    <div id="title"></div>
    <div id="disc"></div>
    <img id="image" />
    <div id="list"></div>
    <div class="opt-box">
        <!-- 左侧是"奖项导航"按钮：随当前位置在上一/下一之间切换
             （在最前档显示「查看下一奖项」，在最后档显示「查看上一奖项」）。
             实际文案与 onclick 由 updateNavButton() 按 step 维护。 -->
        <span class="btn pre-btn" onclick="navStep()">查看下一奖项</span>
        <span class="btn next-btn" onclick="nextStep()">开始抽奖</span>
    </div>
</div>
<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>

    var params = new URLSearchParams(window.location.search);
    var activityId = params.get('activityId');
    var valid = params.get('valid');
    var userToken = localStorage.getItem("token");


    // 获取网页上通过id为disc、image和list的DOM元素的引用。
    var disc = document.getElementById('disc')
    var image = document.getElementById('image')
    var list = document.getElementById('list')

    // 奖品列表
    var steps = null
    // 抽到第几个了
    var step = 0
    // 人员列表
    var names = null
    // 正在做什么
    var state = ''
    // 抽奖是否已全部结束（2026-10-13 新增）
    // 为 true 时 nextStep() 直接返回，按钮同时置灰，
    // 避免结束后再点又重查一遍同一份名单、看上去毫无反应。
    var finished = false

    // 等待DOM加载完成
    document.addEventListener('DOMContentLoaded', function() {
        var titleDiv = document.getElementById('title');
        var activityName = params.get('activityName');
        titleDiv.textContent = activityName;
    });

    function formatDate(dateString) {
        var date = new Date(dateString);
        var hour = ('0' + date.getHours()).slice(-2);
        var minute = ('0' + date.getMinutes()).slice(-2);
        var second = ('0' + date.getSeconds()).slice(-2);
        // 构建格式化的日期字符串
        return hour + ':' + minute + ':' + second;
    }

    // showPic函数用于显示图片和奖品信息。
    // 它将data.disc设置为disc元素的innerHTML，将data.image设置为image元素的src属性，然后显示图片并隐藏列表。
    function showPic(data) {
        disc.textContent = data.tiers + ' ' + data.name + ' ' + data.prizeAmount + '份'
        image.src = data.imageUrl ? data.imageUrl : '/pic/defaultPrizeImg.png'
        image.style.display = 'inline'
        list.style.display = 'none'
        while (list.hasChildNodes()) {
            list.removeChild(list.firstChild)
        }
    }

    // 查询中奖记录
    function showRecords() {
        disc.textContent = "中奖名单"
        image.style.display = 'none'
        list.style.display = 'block'
        while (list.hasChildNodes()) {
            list.removeChild(list.firstChild)
        }
        $.ajax({
            url: '/draw/winning-records/show',
            type: 'POST',
            dataType: 'json',
            contentType: 'application/json',
            data: JSON.stringify({activityId: activityId}),
            headers: {
                'token': userToken
            },
            success: function(result) {
                if (result.code != 200) {
                    alert("查询中奖记录失败！" + result.message);
                } else {
                    var records = result.data
                    if (records == null || records.length == 0) {
                        var item = document.createElement('div');
                        item.textContent = "暂无中奖记录";
                        item.style.fontSize = "24px";
                        item.style.marginTop = "20px";
                        list.appendChild(item);
                    } else {
                        list.className = "records-item"
                        for (var i = 0; i < records.length; ++i) {
                            var item = document.createElement('div')
                            item.textContent = formatDate(records[i].winningTime) + ' '
                            + records[i].winnerName + ' '
                            + records[i].prizeName + ' '
                            + records[i].prizeTier + ' '
                            list.appendChild(item)
                        }
                    }

                    // 分享链接
                    // 检查是否已经有分享按钮，如果没有则创建
                    var optBox = document.querySelector('.opt-box');
                    var existingBtn = optBox.querySelector('.btn.copy-btn');
                    if (!existingBtn) {
                        var newBtn = document.createElement('span');
                        newBtn.className = 'btn copy-btn';
                        // 设置点击事件处理函数
                        newBtn.onclick = function() {
                            // 创建URL对象
                            var currentUrl = new URL(window.location);
                            // 创建URLSearchParams对象
                            var searchParams = currentUrl.searchParams;
                            // 更新参数
                            searchParams.delete('valid');
                            searchParams.append('valid', false);
                            // 防止分享再分享，拼接多个参数
                            searchParams.delete('hideButton');
                            searchParams.append('hideButton', true);
                            // 更新URL对象的搜索字符串
                            currentUrl.search = searchParams.toString();
                            // 获取当前页面的URL
                            var url = currentUrl;
                            // 执行复制操作
                            copyToClipboard(url);
                        };
                        // 设置span元素的文本内容
                        newBtn.textContent = '分享结果';
                        // 将新的span元素添加到.opt-box容器中
                        optBox.appendChild(newBtn);
                    }

                    // 是否隐藏按钮
                    var hideButton = params.get('hideButton');
                    if ((hideButton == null && valid === 'false')
                        || hideButton === 'true') {
                        // 隐藏所有元素
                        var buttons = document.querySelectorAll('.btn.pre-btn, .btn.next-btn');
                        buttons.forEach(function(button) {
                            button.style.display = 'none';
                        });
                    }
                }
            }
        });
    }

    // 复制当前地址
    function copyToClipboard(textToCopy) {
        // navigator clipboard 需要https等安全上下文
        if (navigator.clipboard && window.isSecureContext) {
            // navigator clipboard 向剪贴板写文本
            return navigator.clipboard.writeText(textToCopy)
                .then(() => {alert("链接已复制到剪贴板");});
        } else {
            // 创建text area
            let textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            // 使text area不在viewport，同时设置不可见
            textArea.style.position = "absolute";
            textArea.style.opacity = 0;
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            return new Promise((res, rej) => {
                // 执行复制命令并移除文本框
                document.execCommand('copy') ? res() : rej();
                textArea.remove();
                alert("链接已复制到剪贴板");
            });
        }
    }

    // showBlink函数用于显示闪烁的文字。
    // 它首先设置奖品信息，隐藏图片，显示列表，然后创建与data.count相等数量的span元素。
    function showBlink(data) {
        disc.textContent = data.tiers + ' ' + data.name + ' ' + data.prizeAmount + '份'
        image.style.display = 'none'
        list.style.display = 'block'
        var spans = []
        for (var i = 0; i < data.prizeAmount; ++i) {
            var span = document.createElement('span')
            list.appendChild(span)
            spans.push(span)
        }

        // doBlink函数用于实现文字的闪烁效果，通过window.requestAnimationFrame来循环调用。
        function doBlink() {
            if (state == 'showBlink') {
                // Math.random() 生成一个 [0, 1) 范围内的伪随机数，
                // 所以表达式的结果将在 (-0.5, 0.5] 范围内，这会导致 names 数组的元素随机排序。
                names.sort(function(a, b) {
                    return 0.5 - Math.random()
                })
                // 只展示当前奖项个数的随机人名
                for (var i = 0; i < data.prizeAmount; ++i) {
                    spans[i].textContent = names[i].name
                }
                window.requestAnimationFrame(doBlink)
            }
        }

      // 告诉浏览器——你希望执行一个动画，并且要求浏览器在下次重绘之前调用指定的回调函数更新动画。
      window.requestAnimationFrame(doBlink)
    }

    // 通过后端展示奖品维度中奖者，主要是防止页面刷新
    function showWinnerListWithPrize(data) {
        $.ajax({
            url: '/draw/winning-records/show',
            type: 'POST',
            dataType: 'json',
            contentType: 'application/json',
            headers: {
                'token': userToken
            },
            data: JSON.stringify({activityId: activityId, prizeId: data.prizeId}),
            success: function(result) {
                if (result.code != 200) {
                    alert("查询中奖记录失败！" + result.message);
                } else {
                    var luckRecords = result.data
                    // 从names中移除幸运儿
                    var luck = []
                    // 获得需要删除的用户id
                    var needRemoves = luckRecords.map(function(luckRecord) {
                        return luckRecord.winnerId;
                    });
                    console.log("needRemoves" + JSON.stringify(needRemoves))
                    console.log("names1" + JSON.stringify(names))
                    // 从names中移除包含在luckRecords中的name对应的元素
                    for (var i = 0; i < names.length; i++) {
                        if (needRemoves.includes(names[i].userId)) {
                            var tmp = names.splice(i, 1)  // 移除当前项，并更新索引i，因为后面的项会向前移动
                            luck = luck.concat(tmp)
                            console.log("tmp" + JSON.stringify(tmp))
                            i--  // 减1以确保索引i仍然指向当前的项
                        }
                    }
                    console.log("names2" + JSON.stringify(names))
                    console.log("luck" + JSON.stringify(luck))
                    // 只存放当前奖项的人员信息，下次抽奖会被覆盖
                    data.list = luck.map(x => x)
                    for (var i = 0; i < data.list.length; ++i) {
                        var span = document.createElement('span')
                        span.textContent = data.list[i].name
                        list.appendChild(span)
                    }
                }
            }
        });
    }

    // showList函数用于显示静态的文字列表。它设置奖品信息，隐藏图片，显示列表，并将data.list中的数据添加到列表中。
    function showList(data) {
        disc.textContent = data.tiers + ' ' + data.name + ' ' + data.prizeAmount + '份'
        image.style.display = 'none'
        list.style.display = 'block'
        while (list.hasChildNodes()) {
            list.removeChild(list.firstChild)
        }

        // data.list是前端保存的临时数据，若当前抽奖页刷新，则数据丢失
        // 因此判断一下是否为空，为空需要查询后端
        data.list = data.list || []
        if (data.list.length > 0) {
            for (var i = 0; i < data.list.length; ++i) {
                var span = document.createElement('span')
                span.innerHTML = data.list[i].name
                list.appendChild(span)
            }
        } else {
            showWinnerListWithPrize(data)
        }
    }

    // 这是改变next-btn按钮文本的函数
    function changeNextButtonText(text) {
        var nextButton = document.querySelector('.btn.next-btn');
        nextButton.textContent = text;
    }

    function saveLuck() {
        var data = steps[step]

        var luckUserList = []
        for (var i = 0; i < data.list.length; ++i) {
            luckUserList.push({
                userId: data.list[i].userId,
                userName: data.list[i].name
            })
        }

        var drawPrizesData = {
            activityId: activityId,
            prizeId: data.prizeId,
            winningTime: new Date(),
            winnerList: luckUserList
        };

        // 发送AJAX请求
        $.ajax({
            url: '/draw/prize',
            type: 'POST',
            dataType: 'json',
            contentType: 'application/json',
            headers: {
                'token': userToken
            },
            data: JSON.stringify(drawPrizesData),
            success: function(result) {
                if (window.AuthGuard && AuthGuard.handle(result, '抽奖')) return;
                if (result.code != 200) {
                    alert("抽奖失败！" + result.message);
                }
            },
            error:function(err){
                if (window.AuthGuard && AuthGuard.handle(err, '抽奖')) return;
                // 注：后端业务失败返回 HTTP 200（错误码在 body.code），此处仅处理传输层错误；
                // 401/403 已由 AuthGuard 在 success 分支统一处理（修复 BUG-012）
                console.log(err);
            }
        });
    }

    // nextStep函数用于根据当前状态显示下一个步骤的内容。
    // 它根据state的值和data.list的长度来决定是显示图片、闪烁文字还是静态文字列表，并更新step和state。
    function nextStep() {
        // 抽奖已全部结束时置 finished=true。
        //
        // 为什么必须有这个标志（2026-10-13 实测修复）：
        // 抽奖结束时 showList 分支会 ++step 把 step 推到 steps.length，
        // 但 state 仍留在 'showList'，按钮也仍可点。于是再点一次：
        //   step(=2) < steps.length - 1(=1) 为假 → 又走 showRecords()
        // 后端返回同一份名单、页面重绘成一样的内容 —— 看上去就是"原地踏步"。
        // 实测运行时状态：step=2 state=showList stepsLen=2 steps[step]=undefined
        //
        // 顺带兜住另一个隐患：step 越界后 steps[step] 是 undefined，
        // 下面取到的 data 也是 undefined，一旦有分支解引用它就会直接抛错、
        // 整个页面从此点不动。这里提前 return，两个问题一起解决。
        if (finished) {
            return;
        }
        // 无论走哪个分支，都同步一次「查看上一奖项」的可用状态：
        // 走到第一个奖项时它就该置灰，否则按钮可点却毫无反应。
        updateNavButton();
        var data = steps[step];
        if (!data) {
            // 理论上到不了这里（finished 会先拦住），留着是为了不把
            // "索引越界" 这类问题变成一条看不懂的 TypeError。
            console.warn('nextStep: steps[' + step + '] 不存在，已中止');
            return;
        }
        console.log("steps[" + step + "]:" + JSON.stringify(data))
        if (state == 'showPic') {
            if (data.valid) {
                // 还没抽：抽奖
                state = 'showBlink'
                showBlink(data)
                changeNextButtonText('点我确定')
            } else {
                // 抽过了：展示
                state = 'showList'
                showList(data)
                changeNextButtonText('已抽完，下一步')
            }
        } else if (state == 'showBlink') {
            // 从names中移除幸运儿，并将幸运儿存放起来
            var luck = names.splice(0, data.prizeAmount)
            // 只存放当前奖项的人员信息，下次抽奖会被覆盖
            data.list = luck.map(x => x)
            console.log("data.list:" + JSON.stringify(data.list))
            // 调用后端抽奖接口，保存中奖信息
            saveLuck()
            data.valid = false
            state = 'showList'
            showList(data)
            changeNextButtonText('已抽完，下一步')
        } else if (state == 'showList') {
            if (step < (steps.length - 1)) {
                ++step
                state = ''
                nextStep()
                // 文案交给 nextStep 自己按目标奖项的实际状态决定
                // （已抽过 → 「已抽完，下一步」；还没抽 → 「开始抽奖」）。
                // 原来这里事后强行写死「开始抽奖」，会盖掉 nextStep 刚设好的文案：
                // 从第一个奖项直接前进到已抽过的第二个奖项时，按钮会谎报「开始抽奖」，
                // 用户一点就重抽一遍。
            } else {
                // 抽奖结束，展示全量中奖列表
                if (step == (steps.length - 1)) {
                    ++step
                }
                showRecords()
                // 标记结束：此后 nextStep 不再响应，"已全部抽完"就是终点
                finished = true
                changeNextButtonText('已全部抽完')
                disableNextButton()
                // 结束后允许回看任意奖项，"上一奖项"保持可点
                updateNavButton()
            }
        } else {
            state = 'showPic'
            showPic(data)
            changeNextButtonText('开始抽奖')
        }
    }

    // 抽奖结束后把「下一步」按钮置灰并摘掉 onclick。
    // 文案已经是"已全部抽完"，若仍可点，用户只会以为页面卡住。
    function disableNextButton() {
        var nextButton = document.querySelector('.btn.next-btn');
        if (!nextButton) {
            return;
        }
        nextButton.classList.add('disabled');
        nextButton.removeAttribute('onclick');
        nextButton.style.cursor = 'not-allowed';
        nextButton.style.opacity = '0.45';
    }

    // previousStep函数用于返回到上一个步骤。如果当前步骤不是第一个步骤，则减少step的值，然后调用nextStep函数。
    function previousStep() {
        if (finished) {
            // 抽奖已全部结束，此时 step 被推到了 steps.length（越界）。
            // 回看时必须先退回到最后一个真实奖项，否则下面取不到数据。
            step = steps.length - 1;
        } else if (step <= 0) {
            // 已经在第一个奖项了，没有"上一奖项"可看。
            //
            // 原来这里只在 step>0 时 --step，却不 return，于是 step 停在 0
            // 仍继续往下执行、把第一页重画一遍 —— 表现为"在第一页还能一直
            // 往前查看上一奖项"，按钮点多少次都停在原地。
            return;
        } else {
            --step;
        }

        // 原来这里无条件 state=''，让 nextStep 落到最后的 else 分支、
        // 执行 showPic 并把按钮写成「开始抽奖」—— 于是回看一个**已经抽完**的奖项时，
        // 页面显示的是待抽状态，点一下就再抽一轮，中奖记录被覆盖。
        //
        // 现在保留该奖项的真实状态：
        //   valid=false（已抽过）→ 走 showList，直接显示已中奖名单
        //   valid=true （还没抽）  → 走 showPic，进入正常抽奖流程
        var data = steps[step];
        if (!data) {
            return;
        }
        // 回看的语义是"停在这一档看结果"。这里刻意**不调用 nextStep**：
        // nextStep 在 state=='showList' 时会把 ++step 并 showRecords()，
        // step 于是又被推回越界位置、finished 又被置回 true，
        // 「上一奖项」点了等于没点（实测 step 2→1→2，finished 刚清又被设回）。
        //
        // 直接展示目标奖项，再把状态锁在 showList：
        //   valid=false（已抽过）→ 显示该档中奖名单
        //   valid=true （还没抽）  → 显示奖品图，仍处于可抽状态
        finished = false;
        if (data.valid) {
            showPic(data);
            state = 'showPic';
        } else {
            showList(data);
            state = 'showList';
        }

        var nextButton = document.querySelector('.btn.next-btn');
        if (nextButton) {
            nextButton.classList.remove('disabled');
            nextButton.setAttribute('onclick', 'backToRecords()');
            nextButton.style.cursor = '';
            nextButton.style.opacity = '';
        }
        changeNextButtonText('返回中奖名单')

        // 回到第一个奖项时「查看上一奖项」已经没有意义，置灰它，
        // 否则按钮可点却毫无反应，用户会以为页面卡住
        updateNavButton()
    }

    // 导航按钮的兜底入口。
    // onclick 里带的是带参数的 gotoStep(n)，正常走不到这里；
    // 保留它是为了按钮被静态绑定或参数解析失败时不至于整页报错。
    function navStep() {
        updateNavButton();
        var navButton = document.querySelector('.btn.pre-btn');
        if (!navButton) {
            return;
        }
        if (navButton.textContent === '查看下一奖项' && steps && step < steps.length - 1) {
            gotoStep(step + 1);
        } else {
            previousStep();
        }
    }

    // 按当前 step 同步左侧"奖项导航"按钮的方向、文案与可用状态。
    //
    // 在最前档（step<=0）没有上一奖项可看，按钮改为「查看下一奖项」；
    // 离开最前档后又变回「查看上一奖项」，可一路回溯。
    // 单奖项活动前后都没有可去的方向，按钮直接置灰 ——
    // 留着可点却没反应，用户会以为页面卡住。
    function updateNavButton() {
        var navButton = document.querySelector('.btn.pre-btn');
        if (!navButton) {
            return;
        }
        if (!steps || steps.length === 0) {
            disable(navButton);
            navButton.textContent = '查看上一奖项';
            return;
        }
        // finished 时 step 是越界值（=steps.length），仍属"最后档之后"，
        // 可以往回看任意一档，走「查看上一奖项」。
        var atFirst = !finished && step <= 0;
        // 单奖项且尚未结束：前后都没有可去的方向。
        // 必须先判它，否则 step=0 会先命中 atFirst 走进"可跳下一档"的分支，
        // 而 last 也是 0，gotoStep(1) 越界后什么都不发生。
        var singleAndNotDone = steps.length === 1 && !finished;

        if (singleAndNotDone) {
            navButton.textContent = '查看下一奖项';
            disable(navButton);
        } else if (atFirst) {
            navButton.textContent = '查看下一奖项';
            navButton.setAttribute('onclick', 'gotoStep(' + (step + 1) + ')');
            enable(navButton);
        } else {
            navButton.textContent = '查看上一奖项';
            navButton.setAttribute('onclick', 'previousStep()');
            enable(navButton);
        }
    }

    function enable(btn) {
        btn.classList.remove('disabled');
        btn.style.cursor = '';
        btn.style.opacity = '';
    }

    function disable(btn) {
        btn.classList.add('disabled');
        btn.removeAttribute('onclick');
        btn.style.cursor = 'not-allowed';
        btn.style.opacity = '0.45';
    }

    // 导航到指定奖项（由导航按钮的 onclick 以字面量 step 调用）。
    // 只做"查看"，不改变任何奖项的抽奖状态。
    function gotoStep(target) {
        if (!steps || steps.length === 0) {
            return;
        }
        if (target < 0 || target >= steps.length) {
            return;
        }
        // 往前跳到还没抽过的档位时，不能顺手把它置成"已抽"——
        // 这里只展示，不碰 valid / list / 后端。
        step = target;
        finished = false;
        var data = steps[step];
        if (!data) {
            return;
        }
        if (data.valid) {
            showPic(data);
            state = 'showPic';
            changeNextButtonText('开始抽奖');
        } else {
            showList(data);
            state = 'showList';
            changeNextButtonText('返回中奖名单');
            var nextButton = document.querySelector('.btn.next-btn');
            if (nextButton) {
                enable(nextButton);
                nextButton.setAttribute('onclick', 'backToRecords()');
            }
        }
        updateNavButton();
    }

    // 回看上一奖项后，从当前奖项回到全量中奖名单。
    function backToRecords() {
        if (!steps || steps.length === 0) {
            return;
        }
        step = steps.length;
        state = 'showList'
        showRecords()
        finished = true;
        changeNextButtonText('已全部抽完')
        disableNextButton()
        // 回到总名单后仍可继续回看各奖项
        updateNavButton()
    }

    // 抽奖页面加载逻辑
    function drawPage() {
        // 判断活动是否有效:进行中
        if (valid == "true") {
            // 判断是用户还是管理员，只有管理员有权限抽奖
            var identity = localStorage.getItem("user_identity");
            if (identity == "ADMIN") {
                // 在页面加载完成后，调用reloadConf函数并传入nextStep作为回调函数，以初始化页面显示。
                reloadConf(nextStep)
            } else {
                alert("抽奖未结束，由于您不是管理员，无权限参与抽奖。请耐心等待抽奖结束后查看中奖名单");
            }
        } else {
            // 活动已结束：这里只是查看名单，没有"下一步"可走。
            // 不置灰的话，按钮可点却毫无反应（nextStep 里 steps 为 null，
            // 一进去就 return），用户同样会以为页面卡住。
            finished = true;
            changeNextButtonText('已全部抽完');
            disableNextButton();
            var preButton = document.querySelector('.btn.pre-btn');
            if (preButton) {
                preButton.style.display = 'none';
            }
            showRecords()
        }
    }

    // reloadConf函数用于重新加载配置文件。
    // 如果提供了回调函数func，则在文件读取完成后调用它。
    function reloadConf(func) {
        // 发送AJAX请求
        $.ajax({
            url: '/activity/detail/find',
            type: 'GET',
            data: { activityId: activityId },
            dataType: 'json',
            headers: {
                'token': userToken
            },
            success: function(result) {
                if (window.AuthGuard && AuthGuard.handle(result, '获取活动详情')) return;
                if (result.code != 200) {
                    alert("获取活动详情失败！" + result.message);
                } else {
                    names = result.data.users;
                    steps = result.data.prizes;
                    if (func) func();
                }
            },
            error:function(err){
                if (window.AuthGuard && AuthGuard.handle(err, '获取活动详情')) return;
                // 注：后端业务失败返回 HTTP 200（错误码在 body.code），此处仅处理传输层错误；
                // 401/403 已由 AuthGuard 在 success 分支统一处理（修复 BUG-012）
                console.log(err);
            }
        });
    }

    // 抽奖页起始逻辑
    drawPage()
</script>
</body>
