spring.application.name=lottery_system

## 本机私有配置（敏感值只写在 application-local.properties，该文件已 .gitignore）##
# 模板：application-local.properties 里放下面这些变量，本文件只保留 ${ENV:默认值}
#   ADMIN_SECRET / DB_PASSWORD / RABBITMQ_PASSWORD / ALIYUN_SMS_ACCESS_KEY_ID
#   ALIYUN_SMS_ACCESS_KEY_SECRET / MAIL_USERNAME / MAIL_PASSWORD
#   SMSBAO_USERNAME / SMSBAO_API_KEY / DEEPSEEK_API_KEY
# 外部服务（短信/邮箱/AI）没有默认值：不建 local 文件时应用能启动，但相关功能不可用。
# 也可用系统环境变量同名覆盖（Spring 占位符会优先取环境变量）。
spring.config.import=optional:classpath:application-local.properties

## 管理员口令 ##
# 用途一：携带 X-Admin-Secret 头注册管理员账号
# 用途二：已登录管理员在「改自己邮箱/密码」时，以 verifyType=secret 作为验证方式
# 原先硬编码在 UserController，现已提到配置，保证两处校验用的是同一个值。
# 注意：这是所有管理员共用的常量，不是个人因素，泄露后任何持有管理员会话者都能改凭证。
admin.secret=${ADMIN_SECRET:}

logging.config=classpath:logback-spring.xml
spring.profiles.active=dev
## MySql ##
#驱动类名称
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#数据库url
#注：MySQL 8.0 默认认证插件为 caching_sha2_password。在 useSSL=false 的明文连接下，
#该插件在“服务端认证缓存未命中”时（典型场景：MySQL 刚重启）必须用服务端 RSA 公钥加密密码，
#而驱动默认禁止明文索取公钥，会直接报 “Public Key Retrieval is not allowed” 导致启动即连不上库。
#allowPublicKeyRetrieval=true 允许驱动向服务端索取公钥；本地开发可接受，生产环境建议改用 TLS。
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lottery_system?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
#用户名
spring.datasource.username=root
#密码
spring.datasource.password=${DB_PASSWORD:root}
## MyBatis ##
#Mapper.xml文件路径
#mybatis.mapper-locations=classpath:mapper/*Mapper.xml
#设置驼峰自动转换
mybatis.configuration.map-underscore-to-camel-case=true
#设置类型处理器
mybatis.type-handlers-package=org.example.lottery_system.dao.handler
#短信配置
sms.access-key-id=${ALIYUN_SMS_ACCESS_KEY_ID:}
sms.access-key-secret=${ALIYUN_SMS_ACCESS_KEY_SECRET:}
## redis ##
spring.data.redis.host=localhost
spring.data.redis.port=8888
# 连接空闲超过N(s秒、ms毫秒)后关闭，0为禁用，这里配置值和tcp-keepalive值一致
spring.data.redis.timeout=60s
# 默认使用 lettuce 连接池
# 允许最大连接数，默认8（负值表示没有限制）
spring.data.redis.lettuce.pool.max-active=8
# 最大空闲连接数，默认8
spring.data.redis.lettuce.pool.max-idle=8
# 最小空闲连接数，默认0
spring.data.redis.lettuce.pool.min-idle=0
# 连接用完时，新的请求等待时间(s秒、ms毫秒)，超过该时间抛出异常JedisConnectionException，(默认-1，负值表示没有限制)
spring.data.redis.lettuce.pool.max-wait=5s
## 图片服务 ##
pic.local-path=D:/PIC
# spring boot3 升级配置名
spring.web.resources.static-locations=classpath:/static/,file:${pic.local-path}
## mq ##
# 可用环境变量覆盖，避免换 MQ 地址时改代码：
#   默认 localhost（本机 MQ，开发用）
#   连远端：$env:RABBITMQ_HOST="1.2.3.4" 后再启动
# 背景：原配置写死的 8.136.222.102（阿里云）实例已释放；新实例 172.24.62.152 为 VPC 私网地址，
#      公网不可达，故开发环境改为本机 MQ（详见 docs/test/17-手工验证总流程.md 第 0.3 节）
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}
#消息确认机制，默认auto
spring.rabbitmq.listener.simple.acknowledge-mode=auto
#设置失败重试 5次
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
# Spring QQ邮箱 Configuration
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtps
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.required=true
## 线程池 ##
async.executor.thread.core_pool_size=10
async.executor.thread.max_pool_size=20
async.executor.thread.queue_capacity=20
async.executor.thread.name.prefix=async-service
## 短信宝相关配置 ##
smsbao.username=${SMSBAO_USERNAME:}
smsbao.api-key=${SMSBAO_API_KEY:}
smsbao.signature=【抽奖系统】
smsbao.api-url=http://api.smsbao.com/sms
## DeepSeek AI 配置 (Spring AI OpenAI Starter) ##
spring.ai.openai.api-key=${DEEPSEEK_API_KEY:}
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-chat
# 客服场景需要稳定一致的回答,温度从 0.7 调低到 0.3(减少同一问题多轮回答不一致)
spring.ai.openai.chat.options.temperature=0.3

## ===== AI客服知识库配置(新增) =====
# 向量来源:local=本地 ONNX 模型(默认,不需要 Key、不依赖外网) | remote=远程 OpenAI 兼容接口
ai.embedding.provider=local
# 远程向量服务(仅 provider=remote 时使用):硅基流动 SiliconFlow,兼容 OpenAI 协议
ai.embedding.base-url=https://api.siliconflow.cn/v1
# ⚠️ 更换向量来源/模型后,旧向量必须清空重建,否则语义空间不一致会导致检索错乱:
#    simple 模式 → delete from faq_embedding;
#    framework 模式 → 删除 data/vector-store.json(或设 app.rag.reindex=true)后重启
ai.embedding.api-key=
# remote 模式下的模型与维度(bge-m3 为 1024 维)
ai.embedding.model=BAAI/bge-m3
ai.embedding.dimension=1024
# RAG 检索配置:取最像的几条知识
ai.rag.top-k=3
# 对话记忆:最多保留几轮(一问一答算一轮)
ai.memory.max-round=10
# 记忆过期时间(秒),半小时没人聊就清掉
ai.memory.expire-seconds=1800

## ===== QA 修复 C-10：静态资源缓存策略(追加,未改动以上任何配置) =====
# 问题:前端资源曾无版本指纹,浏览器缓存旧 CSS/JS 会导致"新 HTML + 旧样式"整体失效
# 配套措施:各页面本地资源已加 ?v=20260913 指纹
# 服务端策略:禁用静态资源强缓存,保证发版后立即生效
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true

## ===== 框架化 RAG 重构配置(本地 ONNX Embedding + SimpleVectorStore) =====
# 1) Embedding 提供者选择为本地 transformers(避免与 OpenAI 的 embedding 自动配置冲突)
spring.ai.model.embedding=transformers
# 2) 中文向量模型 bge-small-zh-v1.5(512维)。
#    注意:HuggingFace 官方域名国内不通,模型已用 hf-mirror 预先下载到本地 data/models/
#    这里直接指向本地文件,避免启动时才下载(90MB 全量版会把启动卡住)
spring.ai.embedding.transformer.onnx.modelUri=file:///D:/java/lottery_system/data/models/model_quantized.onnx
spring.ai.embedding.transformer.tokenizer.uri=file:///D:/java/lottery_system/data/models/tokenizer.json
# 3) 模型缓存:首次下载后本地复用,避免每次启动重复下载 90MB
spring.ai.embedding.transformer.cache.enabled=true
spring.ai.embedding.transformer.cache.directory=./data/model-cache

## ===== RAG 管道配置(app.rag.*) =====
# 是否重建知识库索引:true=重新读库→切分→向量化;false=直接加载已落盘的向量库(省算力)
app.rag.reindex=false
# 向量库落盘文件(SimpleVectorStore 持久化)
app.rag.store-file=./data/vector-store.json
# 向量召回条数
app.rag.top-k=5
# 重排后最终注入提示词的条数
app.rag.rerank-top-n=3
# 本地重排开关(无第三方 Rerank API key 时的替代实现)
app.rag.rerank-enabled=true
# 文档切分参数(chunkSize / overlap)
app.rag.chunk-size=800
app.rag.chunk-overlap=100
# 相似度阈值:低于该值的结果丢弃,避免"硬答"
# 0.3 偏高会导致同义问法(如"撤销活动" vs 知识库的"退出活动")漏召回,下调到 0.2 提高召回稳定性
app.rag.min-score=0.2
# 索引并行加载线程数
app.rag.load-threads=4
# 检索模式:
#   simple    = 默认:原手写实现(本地向量写入 MySQL faq_embedding + 余弦相似度 + MCP 工具 + Redis 记忆)
#   framework = Spring AI 框架实现(本地向量 + SimpleVectorStore + Advisor + Jdbc 记忆 + MCP 工具)
#   auto      = 自动:provider=local 时判定 simple 可用;provider=remote 且远程可用→simple,连不上外网→framework
app.rag.mode=simple
# 会话窗口最大消息条数
app.rag.memory-max-messages=20

## ===== 对话记录清理(framework 模式的 Jdbc 会话记忆表) =====
# 保留天数:早于该天数的对话记录会被删除(simple 模式用 Redis,靠 TTL 自动过期,不受此项影响)
app.chat-memory.retention-days=3
# 清理频率:默认每天凌晨 3 点检查一次(记录最长存活约 3 天)
# 想严格"每 3 天清理一次"可改成:0 0 3 */3 * ?
app.chat-memory.cleanup-cron=0 0 3 * * ?

## ===== 可观测性:Zipkin 链路追踪 + Prometheus 指标 =====
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Zipkin 未运行时由应用自动拉起(独立进程,不随应用退出);jar 路径可按需修改
app.zipkin.auto-start=true
app.zipkin.jar=D:/java/lottery_system/zipkin/zipkin-server-3.6.1-exec.jar
app.zipkin.start-timeout-seconds=40
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# 提示:想看"模型实际调用了哪个工具"时,可临时打开下面两行(排查工具调用问题很有用)
# logging.level.org.springframework.ai.model.tool=DEBUG
# logging.level.org.springframework.ai.tool=DEBUG
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.cache.cachecontrol.max-age=0
