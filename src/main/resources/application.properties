spring.application.name=lottery_system

logging.config=classpath:logback-spring.xml
spring.profiles.active=dev
## MySql ##
#驱动类名称
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#数据库url
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lottery_system?characterEncoding=utf8&useSSL=false
#用户名
spring.datasource.username=root
#密码
spring.datasource.password=root
## MyBatis ##
#Mapper.xml文件路径
#mybatis.mapper-locations=classpath:mapper/*Mapper.xml
#设置驼峰自动转换
mybatis.configuration.map-underscore-to-camel-case=true
#设置类型处理器
mybatis.type-handlers-package=org.example.lottery_system.dao.handler
#短信配置
sms.access-key-id=<REDACTED_ALIYUN_ACCESS_KEY_ID>
sms.access-key-secret=<REDACTED_ALIYUN_ACCESS_KEY_SECRET>
## redis ##
spring.data.redis.host=localhost
spring.data.redis.port=8888
# 连接空闲超过N(s秒、ms毫秒)后关闭，0为禁用，这里配置值和tcp-keepalive值一致
spring.data.redis.timeout=60s
# 默认使用 lettuce 连接池
# 允许最大连接数，默认8（负值表示没有限制）
spring.data.redis.lettuce.pool.max-active=8
# 最大空闲连接数，默认8
spring.data.redis.lettuce.pool.max-idle=8
# 最小空闲连接数，默认0
spring.data.redis.lettuce.pool.min-idle=0
# 连接用完时，新的请求等待时间(s秒、ms毫秒)，超过该时间抛出异常JedisConnectionException，(默认-1，负值表示没有限制)
spring.data.redis.lettuce.pool.max-wait=5s
## 图片服务 ##
pic.local-path=D:/PIC
# spring boot3 升级配置名
spring.web.resources.static-locations=classpath:/static/,file:${pic.local-path}
## mq ##
spring.rabbitmq.host=8.136.222.102
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin
#消息确认机制，默认auto
spring.rabbitmq.listener.simple.acknowledge-mode=auto
#设置失败重试 5次
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
# Spring QQ邮箱 Configuration
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=<REDACTED_MAIL_ADDRESS>
spring.mail.password=<REDACTED_QQ_MAIL_AUTHCODE>
spring.mail.protocol=smtps
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.required=true
## 线程池 ##
async.executor.thread.core_pool_size=10
async.executor.thread.max_pool_size=20
async.executor.thread.queue_capacity=20
async.executor.thread.name.prefix=async-service
## 短信宝相关配置 ##
smsbao.username=<REDACTED_SMSBAO_USER>
smsbao.api-key=<REDACTED_SMSBAO_API_KEY>
smsbao.signature=【抽奖系统】
smsbao.api-url=http://api.smsbao.com/sms
## DeepSeek AI 配置 (Spring AI OpenAI Starter) ##
spring.ai.openai.api-key=<REDACTED_DEEPSEEK_API_KEY>
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-chat
spring.ai.openai.chat.options.temperature=0.7

## ===== AI客服知识库配置(新增) =====
# 硅基流动 SiliconFlow,兼容 OpenAI 协议,免费额度
ai.embedding.base-url=https://api.siliconflow.cn/v1
ai.embedding.api-key=
# bge-m3 向量维度是 1024,不用改
ai.embedding.model=BAAI/bge-m3
ai.embedding.dimension=1024
# RAG 检索配置:取最像的几条知识
ai.rag.top-k=3
# 对话记忆:最多保留几轮(一问一答算一轮)
ai.memory.max-round=10
# 记忆过期时间(秒),半小时没人聊就清掉
ai.memory.expire-seconds=1800

## ===== QA 修复 C-10：静态资源缓存策略(追加,未改动以上任何配置) =====
# 问题:前端资源曾无版本指纹,浏览器缓存旧 CSS/JS 会导致"新 HTML + 旧样式"整体失效
# 配套措施:各页面本地资源已加 ?v=20260913 指纹
# 服务端策略:禁用静态资源强缓存,保证发版后立即生效
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.cache.cachecontrol.max-age=0
